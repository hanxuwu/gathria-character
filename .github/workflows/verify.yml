name: Verify Kling workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-kling-wardrobe.txt
      - run: python -m pip install -r scripts/requirements-kling-wardrobe.txt
      - run: python scripts/test_kling_dress_fit.py
      - run: python scripts/test_kling_hair_ear_fit.py
      - run: python scripts/test_kling_hair_ear_overlap.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
