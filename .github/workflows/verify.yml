name: Verify Kling workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the immutable artwork review baseline
        run: git fetch --no-tags --depth=1 origin 5d63ae233ca83e61dc354e122a8708044f4e2653
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-kling-wardrobe.txt
      - run: python -m pip install -r scripts/requirements-kling-wardrobe.txt
      - run: python scripts/test_kling_dress_fit.py
      - run: python scripts/test_kling_hair_ear_fit.py
      - run: python scripts/test_kling_hair_ear_overlap.py
      - run: python scripts/test_kling_hair_expansion.py
      - run: python scripts/test_kling_garment_recipe.py
      - run: python scripts/test_coverage_export_audit.py
      - run: python scripts/test_wardrobe_finish_audit.py
      - run: python scripts/test_wardrobe_temporal_triage.py
      - run: python scripts/verify-side-finish.py
      - run: python scripts/finish-landing-wedding-cuffs.py --check
      - run: python scripts/build-landing-production-assets.py --input artwork/kling-landing-production/body/inputs.json --check
      - run: python scripts/verify-kling-contour-assets.py
      - run: python scripts/verify-kling-male-repair.py
      - run: python scripts/verify-kling-female-repair.py
      - run: python scripts/build-wardrobe-neckline-profiles.py --check
      - run: python scripts/refresh-wardrobe-coverage-catalogs.py --check
      - run: python scripts/inventory-wardrobe-coverage.py --check
      - run: python scripts/verify-wardrobe-finish-preservation.py
      - run: python scripts/build-paired-garment-revisions.py --check
      - run: npm ci
      - run: node scripts/assemble-paired-polish-catalog.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
